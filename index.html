<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geschiedenis van het heelal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene" role="img" aria-label="Animatie van de geschiedenis van het heelal, de aarde en de mens"></canvas>

<header id="kop" class="overlay">
  <p class="eyebrow">Van oerknal tot nu · 13,8 miljard jaar</p>
  <p class="naam">Geschiedenis van het heelal</p>
</header>

<div id="klok" class="overlay">
  <span id="clock">t = 0</span>
  <span id="scene-no">scène 1 van 15</span>
</div>

<section id="lower" class="overlay" aria-live="polite">
  <span id="lower-idx">01 / 15</span>
  <h2 id="lower-title"></h2>
  <p id="lower-txt"></p>
  <p id="lower-fact"></p>
</section>

<div id="controls">
  <button id="prev" type="button" aria-label="Vorige scène">
    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
  </button>
  <button id="play" type="button" aria-label="Pauzeren">
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
  </button>
  <button id="next" type="button" aria-label="Volgende scène">
    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
  </button>
  <div id="timeline"></div>
  <span id="time">0:00 / 0:00</span>
  <button id="mute" type="button" aria-label="Muziek dempen" title="Muziek dempen (M)">
    <svg class="i-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.5 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg>
    <svg class="i-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM15.3 9.3l1.2-1.2 2.2 2.2 2.2-2.2 1.2 1.2-2.2 2.2 2.2 2.2-1.2 1.2-2.2-2.2-2.2 2.2-1.2-1.2 2.2-2.2z"/></svg>
  </button>
  <button id="own" type="button" aria-label="Eigen muziekbestand kiezen" title="Eigen muziekbestand kiezen">
    <svg viewBox="0 0 24 24"><path d="M9 4v10.6A3.5 3.5 0 1 0 11 18V8h7V4z"/></svg>
  </button>
  <input id="own-file" type="file" accept="audio/*" hidden>
</div>

<button id="sound-start" type="button">
  <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.5 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg>
  Muziek aan
</button>

<div id="music-tag" class="overlay"></div>

<div id="hint">Klik of spatie pauzeert · ← → scènes · H verbergt de tekst · M dempt de muziek</div>

<audio id="track" src="muziek/soundtrack.mp3" preload="auto" loop></audio>
<script src="script.js"></script>
<script src="music.js"></script>
</body>
</html>
